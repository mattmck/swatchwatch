name: Deploy Infrastructure Dev

# Manual only. Pushes to dev apply infra from deploy-dev.yml, before the code
# deploy, so the two never run side by side (infrastructure/README.md
# "Deploy ordering"). Don't dispatch this while Deploy Dev is running.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply Terraform changes
        required: true
        default: true
        type: boolean

permissions:
  id-token: write
  contents: read

jobs:
  deploy-infra:
    uses: ./.github/workflows/deploy-infra.yml
    with:
      environment: dev
      openai_location: eastus
      apply: ${{ github.event_name == 'workflow_dispatch' && inputs.apply || true }}
    secrets: inherit
