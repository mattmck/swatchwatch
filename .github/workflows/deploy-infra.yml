name: Deploy Infrastructure

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment to deploy (dev/prod)
        required: true
        type: string
      apply:
        description: Apply Terraform changes
        required: false
        default: true
        type: boolean
      openai_location:
        description: >-
          Explicit Azure OpenAI region override. Leave unset to use the
          environment's OPENAI_REGIONS / OPENAI_LOCATION variables. Must match
          the region the environment's account already lives in.
        required: false
        type: string
      allow_openai_replace:
        description: >-
          Allow a plan that deletes or replaces an Azure OpenAI / Cognitive
          Services account or deployment to be applied. Default false.
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment to deploy (dev/prod)
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod
      apply:
        description: Apply Terraform changes
        required: true
        default: true
        type: boolean
      openai_location:
        description: >-
          Explicit Azure OpenAI region override. Leave EMPTY to use the
          environment's OPENAI_REGIONS / OPENAI_LOCATION variables (prod:
          centralus, dev: eastus). A different region replaces (soft-deletes)
          the account.
        required: false
        type: string
      allow_openai_replace:
        description: >-
          Allow a plan that deletes or replaces an Azure OpenAI / Cognitive
          Services account or deployment to be applied. Leave false unless
          you really mean to move or recreate the account.
        required: false
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-infra-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy-infra:
    name: Terraform Apply (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_environment: ${{ inputs.environment }}
      TF_VAR_github_repository: ${{ github.repository }}
      # Azure OpenAI region: the environment decides, never a workflow default.
      # OPENAI_REGIONS (JSON list) wins in Terraform; otherwise the explicit
      # openai_location input, then the OPENAI_LOCATION variable. The "Validate
      # Azure OpenAI region" step fails when none is set, and the plan guard
      # below refuses to apply a plan that deletes or replaces an account.
      # See infrastructure/README.md "Azure OpenAI region and replacement guard".
      TF_VAR_openai_location: ${{ inputs.openai_location || vars.OPENAI_LOCATION || '' }}
      TF_VAR_openai_regions: ${{ vars.OPENAI_REGIONS || '[]' }}
      OPENAI_LOCATION_INPUT: ${{ inputs.openai_location || '' }}
      OPENAI_LOCATION_VAR: ${{ vars.OPENAI_LOCATION || '' }}
      ALLOW_OPENAI_REPLACE: ${{ inputs.allow_openai_replace && 'true' || 'false' }}
      TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
      TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
      TFSTATE_CONTAINER: ${{ vars.TFSTATE_CONTAINER || 'tfstate' }}
      TFSTATE_BLOB_NAME: ${{ vars.TFSTATE_BLOB_NAME || format('{0}.terraform.tfstate', inputs.environment) }}
      # Always false in Azure: deploy.yml writes AUTH_DEV_BYPASS=false too, and the settings check
      # after each deploy compares the two, so a GitHub variable set to true would fail it.
      TF_VAR_auth_dev_bypass: 'false'
      TF_VAR_shareable_wishlist_enabled: ${{ vars.SHAREABLE_WISHLIST_ENABLED || 'false' }}
      TF_VAR_shareable_looks_enabled: ${{ vars.SHAREABLE_LOOKS_ENABLED || 'false' }}
      TF_VAR_azure_ad_b2c_tenant: ${{ vars.AZURE_AD_B2C_TENANT || vars.NEXT_PUBLIC_B2C_TENANT || 'to-be-added' }}
      TF_VAR_azure_ad_b2c_client_id: ${{ secrets.AZURE_AD_B2C_CLIENT_ID || 'to-be-added' }}
      # External ID (CIAM) web service principal, opt-in per environment. The
      # azuread.ciam provider signs in to CIAM_TERRAFORM_CLIENT_ID with this
      # job's GitHub OIDC token (federated credential, no secret); see
      # infrastructure/README.md "External ID service principal".
      TF_VAR_manage_ciam_service_principal: ${{ vars.MANAGE_CIAM_SERVICE_PRINCIPAL || 'false' }}
      TF_VAR_ciam_tenant_id: ${{ vars.CIAM_TENANT_ID || '' }}
      TF_VAR_ciam_terraform_client_id: ${{ vars.CIAM_TERRAFORM_CLIENT_ID || '' }}
      TF_VAR_is_automation: true
      TF_VAR_create_openai_resources: ${{ vars.CREATE_OPENAI_RESOURCES || 'true' }}
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_openai_endpoint: ${{ vars.OPENAI_ENDPOINT || '' }}
      TF_VAR_openai_deployment_name: ${{ vars.OPENAI_DEPLOYMENT_NAME || 'hex-detector' }}
      TF_VAR_openai_batch_deployment_name: ${{ vars.OPENAI_BATCH_DEPLOYMENT_NAME || 'hex-detector-batch' }}
      TF_VAR_openai_batch_model_name: ${{ vars.OPENAI_BATCH_MODEL_NAME || '' }}
      TF_VAR_openai_batch_model_version: ${{ vars.OPENAI_BATCH_MODEL_VERSION || '' }}
      TF_VAR_openai_batch_deployment_sku_name: ${{ vars.OPENAI_BATCH_DEPLOYMENT_SKU_NAME || 'GlobalBatch' }}
      TF_VAR_openai_batch_deployment_capacity: ${{ vars.OPENAI_BATCH_DEPLOYMENT_CAPACITY || '5000' }}
      TF_VAR_hex_detection_batch_enabled: ${{ vars.HEX_DETECTION_BATCH_ENABLED || 'false' }}
      TF_VAR_hex_detection_snap_enabled: ${{ vars.HEX_DETECTION_SNAP_ENABLED || 'false' }}
      OPENAI_ACCOUNT_NAME: ${{ vars.OPENAI_ACCOUNT_NAME || '' }}
      TF_VAR_apim_enabled: ${{ vars.APIM_ENABLED || 'false' }}
      # vars first, then literal default
      TF_VAR_apim_sku_name: ${{ vars.APIM_SKU_NAME || 'Consumption_0' }}
      # vars first, then literal default
      TF_VAR_openai_gateway_enabled: ${{ vars.OPENAI_GATEWAY_ENABLED || 'false' }}
      # secrets first (recommended for prod), then vars fallback, else empty string
      # (Terraform will validate when gateway is enabled)
      TF_VAR_apim_openai_subscription_key_uri: ${{ secrets.APIM_OPENAI_SUBSCRIPTION_KEY_URI || vars.APIM_OPENAI_SUBSCRIPTION_KEY_URI || '' }}
      # Observability Phase 3 (#281): alerts are prod-only by default (D16);
      # ALERTS_ENABLED overrides. The address is never committed: set ALERT_EMAIL
      # as an environment secret (masked in logs) or variable.
      TF_VAR_alerts_enabled: ${{ vars.ALERTS_ENABLED || (inputs.environment == 'prod' && 'true' || 'false') }}
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL || vars.ALERT_EMAIL || '' }}

    steps:
      - uses: actions/checkout@v6

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Validate required backend settings
        run: |
          missing=0
          if [ -z "$TFSTATE_RESOURCE_GROUP" ]; then
            echo "::error::Missing variable TFSTATE_RESOURCE_GROUP"
            missing=1
          fi
          if [ -z "$TFSTATE_STORAGE_ACCOUNT" ]; then
            echo "::error::Missing variable TFSTATE_STORAGE_ACCOUNT"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Validate Azure OpenAI region
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          if [ "$TF_VAR_create_openai_resources" != "true" ]; then
            echo "CREATE_OPENAI_RESOURCES is not true; Terraform does not manage OpenAI accounts here, skipping the region check."
            exit 0
          fi

          regions="$(printf '%s' "$TF_VAR_openai_regions" | tr -d '[:space:]')"
          if [ -n "$regions" ] && [ "$regions" != "[]" ]; then
            echo "Azure OpenAI regions come from the OPENAI_REGIONS variable: $TF_VAR_openai_regions"
            if [ -n "$OPENAI_LOCATION_INPUT" ]; then
              echo "::notice::The openai_location input ('$OPENAI_LOCATION_INPUT') is ignored because OPENAI_REGIONS is set for '$ENVIRONMENT'."
            fi
            exit 0
          fi

          if [ -z "$TF_VAR_openai_location" ]; then
            echo "::error::No Azure OpenAI region is configured for the '$ENVIRONMENT' environment. Set the OPENAI_LOCATION (or OPENAI_REGIONS) GitHub environment variable (prod: centralus, dev: eastus). The workflow never defaults the region: a wrong region replaces the account and soft-deletes its deployments. See infrastructure/README.md."
            exit 1
          fi

          input_lc="$(printf '%s' "$OPENAI_LOCATION_INPUT" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          var_lc="$(printf '%s' "$OPENAI_LOCATION_VAR" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          if [ -n "$input_lc" ] && [ -n "$var_lc" ] && [ "$input_lc" != "$var_lc" ]; then
            if [ "$ALLOW_OPENAI_REPLACE" != "true" ]; then
              echo "::error::The openai_location input ('$OPENAI_LOCATION_INPUT') differs from the '$ENVIRONMENT' environment's OPENAI_LOCATION variable ('$OPENAI_LOCATION_VAR'). Moving the account to another region destroys it (2026-10-19 incident). Re-run without the input, or set allow_openai_replace=true only if you really mean to move it."
              exit 1
            fi
            echo "::warning::openai_location input ('$OPENAI_LOCATION_INPUT') overrides OPENAI_LOCATION ('$OPENAI_LOCATION_VAR') because allow_openai_replace=true."
          fi

          if [ -n "$OPENAI_LOCATION_INPUT" ]; then
            echo "Azure OpenAI region: $TF_VAR_openai_location (from the openai_location input)"
          else
            echo "Azure OpenAI region: $TF_VAR_openai_location (from the OPENAI_LOCATION variable)"
          fi

      - name: Terraform init
        run: |
          TFSTATE_ACCESS_KEY="$(az storage account keys list \
            --resource-group "$TFSTATE_RESOURCE_GROUP" \
            --account-name "$TFSTATE_STORAGE_ACCOUNT" \
            --query '[0].value' -o tsv)"

          az storage container create \
            --name "$TFSTATE_CONTAINER" \
            --account-name "$TFSTATE_STORAGE_ACCOUNT" \
            --account-key "$TFSTATE_ACCESS_KEY" \
            --output none

          terraform -chdir=infrastructure init -reconfigure -no-color \
            -backend-config="resource_group_name=$TFSTATE_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$TFSTATE_STORAGE_ACCOUNT" \
            -backend-config="container_name=$TFSTATE_CONTAINER" \
            -backend-config="key=$TFSTATE_BLOB_NAME" \
            -backend-config="access_key=$TFSTATE_ACCESS_KEY"

      - name: Resolve Terraform outputs and OpenAI settings
        run: |
          RESOURCE_GROUP_NAME="$(terraform -chdir=infrastructure output -raw resource_group_name 2>/dev/null || true)"
          KEY_VAULT_NAME="$(terraform -chdir=infrastructure output -raw key_vault_name 2>/dev/null || true)"
          TF_OUTPUT_OPENAI_ENDPOINT="$(terraform -chdir=infrastructure output -raw openai_endpoint 2>/dev/null || true)"
          TF_OUTPUT_OPENAI_DEPLOYMENT="$(terraform -chdir=infrastructure output -raw openai_hex_deployment_name 2>/dev/null || true)"
          TF_OUTPUT_OPENAI_ACCOUNT_NAME="$(terraform -chdir=infrastructure output -raw openai_account_name 2>/dev/null || true)"

          if [ -z "$RESOURCE_GROUP_NAME" ] || [ -z "$KEY_VAULT_NAME" ]; then
            echo "::error::Unable to resolve required Terraform outputs (resource_group_name, key_vault_name)."
            exit 1
          fi

          RESOLVED_OPENAI_ENDPOINT="$TF_VAR_openai_endpoint"
          if [ -z "$RESOLVED_OPENAI_ENDPOINT" ] && [ -n "$TF_OUTPUT_OPENAI_ENDPOINT" ]; then
            RESOLVED_OPENAI_ENDPOINT="$TF_OUTPUT_OPENAI_ENDPOINT"
          fi

          if [ -n "$RESOLVED_OPENAI_ENDPOINT" ]; then
            echo "TF_VAR_openai_endpoint=$RESOLVED_OPENAI_ENDPOINT" >> "$GITHUB_ENV"
          fi

          RESOLVED_OPENAI_DEPLOYMENT="$TF_VAR_openai_deployment_name"
          if [ -z "$RESOLVED_OPENAI_DEPLOYMENT" ] && [ -n "$TF_OUTPUT_OPENAI_DEPLOYMENT" ]; then
            RESOLVED_OPENAI_DEPLOYMENT="$TF_OUTPUT_OPENAI_DEPLOYMENT"
          fi
          if [ -z "$RESOLVED_OPENAI_DEPLOYMENT" ]; then
            RESOLVED_OPENAI_DEPLOYMENT="gpt-4o-mini"
          fi
          echo "TF_VAR_openai_deployment_name=$RESOLVED_OPENAI_DEPLOYMENT" >> "$GITHUB_ENV"

          RESOLVED_OPENAI_ACCOUNT_NAME="$OPENAI_ACCOUNT_NAME"
          if [ -z "$RESOLVED_OPENAI_ACCOUNT_NAME" ] && [ -n "$TF_OUTPUT_OPENAI_ACCOUNT_NAME" ]; then
            RESOLVED_OPENAI_ACCOUNT_NAME="$TF_OUTPUT_OPENAI_ACCOUNT_NAME"
          fi
          if [ -z "$RESOLVED_OPENAI_ACCOUNT_NAME" ] && [ -n "$RESOLVED_OPENAI_ENDPOINT" ]; then
            RESOLVED_OPENAI_ACCOUNT_NAME="$(echo "$RESOLVED_OPENAI_ENDPOINT" | sed -E 's#https?://([^./]+).*#\1#')"
          fi

          echo "RESOLVED_RESOURCE_GROUP_NAME=$RESOURCE_GROUP_NAME" >> "$GITHUB_ENV"
          echo "RESOLVED_KEY_VAULT_NAME=$KEY_VAULT_NAME" >> "$GITHUB_ENV"
          echo "RESOLVED_OPENAI_ENDPOINT=$RESOLVED_OPENAI_ENDPOINT" >> "$GITHUB_ENV"
          echo "RESOLVED_OPENAI_ACCOUNT_NAME=$RESOLVED_OPENAI_ACCOUNT_NAME" >> "$GITHUB_ENV"

      - name: Load PostgreSQL password from Key Vault
        run: |
          PG_PASSWORD="$(az keyvault secret show \
            --vault-name "$RESOLVED_KEY_VAULT_NAME" \
            --name pg-password \
            --query value -o tsv 2>/dev/null || true)"

          if [ -z "$PG_PASSWORD" ]; then
            echo "::error::Key Vault secret 'pg-password' not found in vault '$RESOLVED_KEY_VAULT_NAME'."
            exit 1
          fi

          echo "::add-mask::$PG_PASSWORD"
          echo "TF_VAR_pg_admin_password=$PG_PASSWORD" >> "$GITHUB_ENV"

      - name: Load Azure OpenAI key from configured account
        run: |
          if [ "$TF_VAR_create_openai_resources" = "true" ]; then
            echo "Terraform manages OpenAI resources; skipping external OpenAI key injection."
            exit 0
          fi

          if [ -z "$RESOLVED_OPENAI_ENDPOINT" ]; then
            echo "No OpenAI endpoint configured; skipping TF_VAR_openai_api_key injection."
            exit 0
          fi

          if [ -z "$RESOLVED_OPENAI_ACCOUNT_NAME" ]; then
            echo "::error::Unable to resolve OpenAI account name. Set OPENAI_ACCOUNT_NAME or OPENAI_ENDPOINT in environment variables."
            exit 1
          fi

          OPENAI_KEY="$(az cognitiveservices account keys list \
            --resource-group "$RESOLVED_RESOURCE_GROUP_NAME" \
            --name "$RESOLVED_OPENAI_ACCOUNT_NAME" \
            --query key1 -o tsv 2>/dev/null || true)"

          if [ -z "$OPENAI_KEY" ]; then
            echo "::error::Unable to load key for OpenAI account '$RESOLVED_OPENAI_ACCOUNT_NAME' in '$RESOLVED_RESOURCE_GROUP_NAME'."
            exit 1
          fi

          echo "::add-mask::$OPENAI_KEY"
          echo "TF_VAR_openai_api_key=$OPENAI_KEY" >> "$GITHUB_ENV"

      - name: Terraform validate
        run: terraform -chdir=infrastructure validate -no-color

      - name: Terraform refresh state
        run: terraform -chdir=infrastructure apply -refresh-only -auto-approve -no-color

      - name: Terraform plan
        run: terraform -chdir=infrastructure plan -out=tfplan -no-color

      # Refuse to apply a plan that deletes or replaces any Cognitive Services
      # account or deployment (Azure OpenAI, Speech, Document Intelligence).
      # Deleting an OpenAI account soft-deletes it with every deployment, and
      # the usual cause is a region change (OPENAI_LOCATION / OPENAI_REGIONS or
      # the openai_location input). Only allow_openai_replace=true lets it through.
      - name: Guard against Azure OpenAI account replacement
        env:
          PLAN_JSON: ${{ runner.temp }}/tfplan.json
        run: |
          terraform -chdir=infrastructure show -json tfplan > "$PLAN_JSON"

          destructive="$(jq -r '
            [ .resource_changes[]?
              | select(.type == "azurerm_cognitive_account" or .type == "azurerm_cognitive_deployment")
              | select((.change.actions | index("delete")) != null)
              | "\(.address): \(.change.actions | join(" then "))"
            ] | .[]' "$PLAN_JSON")"

          if [ -z "$destructive" ]; then
            echo "Plan guard: no Cognitive Services account or deployment is deleted or replaced."
            exit 0
          fi

          echo "Plan guard: the plan deletes or replaces these Cognitive Services resources:"
          echo "$destructive"

          if [ "$ALLOW_OPENAI_REPLACE" = "true" ]; then
            echo "::warning::allow_openai_replace=true: applying a plan that deletes or replaces the Cognitive Services resources listed above."
            exit 0
          fi

          echo "::error::The plan would delete or replace Azure OpenAI / Cognitive Services resources (listed above), which soft-deletes the account and all its deployments. This is usually a region change: check OPENAI_LOCATION / OPENAI_REGIONS for this environment and do not pass a different openai_location. Re-run with allow_openai_replace=true only if the replacement is intended. See infrastructure/README.md."
          exit 1

      - name: Terraform apply
        if: ${{ inputs.apply }}
        run: terraform -chdir=infrastructure apply -auto-approve -no-color tfplan

      # Fails when a Terraform-managed Function App setting is missing from the
      # live app or holds another value, e.g. a code deploy that overlapped
      # this apply wrote back its stale copy (infrastructure/README.md
      # "Deploy ordering"). Names only, never values.
      - name: Check Function App settings match Terraform
        if: ${{ inputs.apply }}
        run: bash .github/scripts/check-function-app-settings.sh infrastructure
