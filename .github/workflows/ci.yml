name: CI

on:
  pull_request:
    branches: [dev, main]
    # Docs-only PRs have nothing to lint or build.
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Lint, Build and Test run in parallel; each restores the same cached
# node_modules (see .github/actions/setup-deps), so none waits on the others.
jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-deps

      - name: Build shared types
        run: npm run build:shared

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-deps

      # Build shared once; the root build:web / build:functions scripts would
      # each rebuild it.
      - name: Build shared types
        run: npm run build:shared

      - name: Build web
        run: npm run build --workspace=apps/web

      - name: Build functions
        run: npm run build --workspace=packages/functions

  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-deps

      # The functions pretest builds shared and compiles functions before
      # running the node:test suites (no database needed).
      - name: Functions unit tests
        run: npm run test --workspace=swatchwatch-functions

      - name: Web unit tests
        run: npm run test --workspace=swatchwatch-web
