name: CI

on:
  pull_request:
    branches: [dev, main]

# Jobs only check out and build; the GITHUB_TOKEN needs read access to contents.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Docs-only PRs (only *.md files or docs/**) have nothing to lint, build or test, but
# "Unit Tests" is a required check on dev, so the workflow must still run and report
# it. A workflow-level paths-ignore would never report the check and block the merge;
# instead `changes` classifies the PR and the jobs below are skipped by `if:`, which
# GitHub counts as passing for required checks.
#
# Lint, Build, Test and Mobile run in parallel after `changes`; each restores the same cached
# node_modules (see .github/actions/setup-deps; Mobile restores its own cache that also
# holds apps/mobile), so none waits on the others.
jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - name: Classify changed files
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[].filename' > changed-files.txt
          code=false
          while IFS= read -r file; do
            case "$file" in
              docs/*|*.md) ;;
              *) code=true; break ;;
            esac
          done < changed-files.txt
          echo "Changed files: $(wc -l < changed-files.txt); code changes: $code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  lint-and-typecheck:
    name: Lint & Typecheck
    needs: changes
    # Run unless the PR is docs-only. If `changes` fails its output is empty, so the
    # job still runs (fail safe: never skip checks because detection broke).
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-deps

      - name: Build shared types
        run: npm run build:shared

      # apps/mobile has its own job (it needs the Expo dependencies installed).
      - name: Lint
        run: npm run lint --workspace=apps/web --workspace=packages/functions --workspace=packages/shared --if-present

      - name: Typecheck
        run: npm run typecheck --workspace=apps/web --workspace=packages/functions --workspace=packages/shared --if-present

  mobile:
    name: Mobile (lint, typecheck, tests, export)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest

    # No device builds: the Expo app is only linted, type-checked and unit tested here.
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-deps
        with:
          include-mobile: 'true'

      - name: Build shared types
        run: npm run build:shared

      - name: Design tokens match the web theme
        run: node scripts/sync-design-tokens.mjs --check

      - name: Lint
        run: npm run lint --workspace=apps/mobile

      - name: Typecheck
        run: npm run typecheck --workspace=apps/mobile

      - name: Unit tests
        run: npm run test --workspace=apps/mobile

      # Bundles the JS for both platforms with Metro + Hermes (no device or Xcode needed), which
      # catches imports of modules that don't resolve and syntax Hermes can't compile.
      - name: Export smoke (iOS and Android bundles)
        working-directory: apps/mobile
        run: npx expo export --platform ios --platform android --output-dir "$RUNNER_TEMP/expo-export"

  build:
    name: Build
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-deps

      # Build shared once; the root build:web / build:functions scripts would
      # each rebuild it.
      - name: Build shared types
        run: npm run build:shared

      - name: Build web
        run: npm run build --workspace=apps/web

      - name: Build functions
        run: npm run build --workspace=packages/functions

  test:
    name: Unit Tests
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-deps

      # The functions pretest builds shared and compiles functions before
      # running the node:test suites (no database needed).
      - name: Functions unit tests
        run: npm run test --workspace=swatchwatch-functions

      - name: Web unit tests
        run: npm run test --workspace=swatchwatch-web

      - name: Shared unit tests
        run: npm run test --workspace=swatchwatch-shared
