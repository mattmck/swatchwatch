name: Deploy Dev

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  # Infra and code deploys for dev run in this one workflow, infra first, like
  # deploy-prod.yml. Run side by side, Azure/functions-action writes back the
  # app settings it read before Terraform's apply and drops new ones
  # (2026-10-23). See infrastructure/README.md "Deploy ordering".
  detect-infra-changes:
    name: Detect Infra Changes
    runs-on: ubuntu-latest
    outputs:
      infra_changed: ${{ steps.detect.outputs.infra_changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed infrastructure files
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "push" ] && [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            RANGE="$BEFORE_SHA..$CURRENT_SHA"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            RANGE="HEAD^..HEAD"
          else
            RANGE=""
          fi

          # Same paths Deploy Infrastructure Dev used to trigger on.
          PATTERN='^(infrastructure/|\.github/workflows/deploy-infra(-dev)?\.yml$|\.github/scripts/check-function-app-settings\.sh$)'
          if [ -n "$RANGE" ]; then
            CHANGED="$(git diff --name-only "$RANGE" | grep -E "$PATTERN" || true)"
          else
            CHANGED="$(git show --name-only --pretty='' HEAD | grep -E "$PATTERN" || true)"
          fi

          if [ -n "$CHANGED" ]; then
            echo "infra_changed=true" >> "$GITHUB_OUTPUT"
            echo "Infrastructure changes detected:"
            echo "$CHANGED"
          else
            echo "infra_changed=false" >> "$GITHUB_OUTPUT"
            echo "No infrastructure changes detected."
          fi

  deploy-infra:
    name: Deploy Infrastructure First
    needs: detect-infra-changes
    if: ${{ needs.detect-infra-changes.outputs.infra_changed == 'true' }}
    uses: ./.github/workflows/deploy-infra.yml
    with:
      environment: dev
      openai_location: eastus
      apply: true
    secrets: inherit

  deploy:
    needs:
      - detect-infra-changes
      - deploy-infra
    if: ${{ always() && (needs.detect-infra-changes.outputs.infra_changed == 'false' || needs.deploy-infra.result == 'success') }}
    uses: ./.github/workflows/deploy.yml
    with:
      environment: dev
      web_app_url: https://dev.swatchwatch.app
    secrets: inherit
