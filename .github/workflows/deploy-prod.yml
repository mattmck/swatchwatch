name: Deploy Prod

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  detect-infra-changes:
    name: Detect Infra Changes
    runs-on: ubuntu-latest
    outputs:
      infra_changed: ${{ steps.detect.outputs.infra_changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed infrastructure files
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "push" ] && [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            if git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
              RANGE="$BEFORE_SHA..$CURRENT_SHA"
            else
              # The push base is gone (force-push or history rewrite), so we can't tell what
              # changed. Run the infra deploy rather than skip it; an unchanged plan applies nothing.
              echo "Push base $BEFORE_SHA is not in this checkout; treating infrastructure as changed."
              echo "infra_changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            RANGE="HEAD^..HEAD"
          else
            RANGE=""
          fi

          # The git call is kept out of the grep pipeline so a failure stops the job instead of
          # reading as "no changes".
          PATTERN='^(infrastructure/|\.github/workflows/deploy-infra\.yml$|\.github/scripts/check-function-app-settings\.sh$)'
          if [ -n "$RANGE" ]; then
            FILES="$(git diff --name-only "$RANGE")"
          else
            FILES="$(git show --name-only --pretty='' HEAD)"
          fi
          CHANGED="$(printf '%s\n' "$FILES" | grep -E "$PATTERN" || true)"

          if [ -n "$CHANGED" ]; then
            echo "infra_changed=true" >> "$GITHUB_OUTPUT"
            echo "Infrastructure changes detected:"
            echo "$CHANGED"
          else
            echo "infra_changed=false" >> "$GITHUB_OUTPUT"
            echo "No infrastructure changes detected."
          fi

  deploy-infra:
    name: Deploy Infrastructure First
    needs: detect-infra-changes
    if: ${{ needs.detect-infra-changes.outputs.infra_changed == 'true' }}
    uses: ./.github/workflows/deploy-infra.yml
    with:
      environment: prod
      openai_location: centralus
      apply: true
    secrets: inherit

  deploy:
    needs:
      - detect-infra-changes
      - deploy-infra
    if: ${{ always() && (needs.detect-infra-changes.outputs.infra_changed == 'false' || needs.deploy-infra.result == 'success') }}
    uses: ./.github/workflows/deploy.yml
    with:
      environment: prod
      web_app_url: https://swatchwatch.app
    secrets: inherit
