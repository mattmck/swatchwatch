# Version updates go to `dev`, where feature work lands (decision D24).
# Security updates ignore `target-branch`: GitHub always opens them against
# the default branch (`main`), so port those to `dev` by hand.
# Dependabot reads this file only from the default branch, so it takes effect
# once the next `dev → main` release carries it to `main`.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # The root overrides pin React to the exact version React Native's
      # renderer needs; bump it together with Expo, not on its own.
      - dependency-name: react
      - dependency-name: react-dom
      # The Expo SDK pins these native packages; move them with the SDK
      # (`npx expo install --fix`), never ahead of it.
      - dependency-name: react-native
      - dependency-name: react-native-safe-area-context
      - dependency-name: react-native-screens
      - dependency-name: "@react-native-async-storage/async-storage"
      # Majors held back from the 2026-10 npm-major group (#465):
      # typescript-eslint supports TypeScript < 6.1 and Functions still use
      # moduleResolution node10 (removed in 7); @types/node follows the Node 22
      # runtime; p-limit 7 is ESM-only (Functions are CommonJS);
      # eslint-plugin-react (Next and Expo configs) breaks on ESLint 10.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: p-limit
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
      npm-major:
        update-types: [major]
